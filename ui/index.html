<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://nbadash.cache https://*.espncdn.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>NBA 2026-27</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="chrome">
    <header id="topbar">
      <button id="brand" class="brand" type="button" title="NBA 2026-27">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">NBA <b>2026-27</b></span>
      </button>
      <nav id="nav" class="nav" aria-label="Sections">
        <a href="#/standings" data-route="standings">Standings</a>
        <a href="#/leaders" data-route="leaders">Leaderboards</a>
        <a href="#/rankings" data-route="rankings">Team Rankings</a>
        <a href="#/transactions" data-route="transactions">Transactions</a>
        <a href="#/freeagents" data-route="freeagents">Free Agents</a>
      </nav>
      <div class="topbar-right">
        <button id="btn-version" class="ver-btn" type="button" hidden title="Check for updates"></button>
        <span id="live-status" class="live-status" title=""></span>
        <button id="btn-refresh" class="icon-btn" type="button" title="Refresh live scores (F5)" aria-label="Refresh">&#x21bb;</button>
        <button id="btn-theme" class="icon-btn" type="button" title="Theme" aria-label="Theme"></button>
        <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">&#x2699;</button>
      </div>
    </header>
    <div id="haltbar" class="haltbar" hidden role="status"></div>
    <div id="syncbar" class="syncbar" hidden role="status"><div class="syncbar-fill"></div><span class="syncbar-text"></span></div>
    <nav id="banner" class="banner" aria-label="Teams"></nav>
    <nav id="weekbar" class="weekbar" aria-label="Weeks" hidden></nav>
    <div class="navpill-row">
      <div id="navpill" class="navpill" role="navigation" aria-label="Page navigation">
        <button id="btn-back" class="np-btn" type="button" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="btn-fwd" class="np-btn" type="button" title="Forward (Alt+Right)" aria-label="Forward"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <a id="btn-home" class="np-btn" href="#/" title="Home" aria-label="Home" data-route="home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg></a>
        <span class="np-sep" aria-hidden="true"></span>
        <div class="psearch">
          <div id="psearch-ghost" class="psearch-ghost" aria-hidden="true"></div>
          <input id="psearch" type="search" placeholder="Search Players..." autocomplete="off" spellcheck="false" aria-label="Search players">
          <div id="psearch-results" class="psearch-results" hidden></div>
        </div>
      </div>
    </div>
    </div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="cmpbar" class="cmpbar" hidden></div>
  <div id="overlay-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
